<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント日程調整</title>
  <style>
    :root {
      --primary: #1976d2;
      --bg: #f5f7fa;
      --text: #333;
      --border: #ccc;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,.1);
    }
    h1, h2 { color: var(--primary); }
    h1 { margin-top: 0; }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 40px; color: #666; font-size: 1.1rem; }
    .notice {
      text-align: center;
      padding: 34px 16px;
      color: #666;
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: 0;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #115293; }
    button:disabled { opacity: .55; cursor: default; }
    .table-wrapper {
      overflow-x: auto;
      margin: 20px 0 30px;
      border: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: center; min-width: 50px; }
    th { background: #f1f1f1; }
    #attendance-table th:first-child,
    #attendance-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #f9f9f9;
      text-align: left;
    }
    .user-col {
      min-width: 100px;
      max-width: 160px;
      white-space: normal;
      word-break: break-word;
    }
    .mark-circle { color: #2e7d32; font-weight: bold; font-size: 1.2em; }
    .mark-triangle { color: #f57f17; font-weight: bold; font-size: 1.2em; }
    .mark-cross { color: #c62828; font-weight: bold; font-size: 1.2em; }
    .attendance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
    }
    .attendance-row:last-child { border-bottom: none; }
    .attendance-options label { display: inline-block; margin: 0 15px 0 0; font-weight: normal; cursor: pointer; }
    .edit-box {
      background: #fff3e0;
      padding: 15px;
      border: 1px solid #ffe082;
      border-radius: 4px;
      margin-bottom: 25px;
    }
    .edit-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .edit-row select { width: auto; min-width: 180px; }
    .btn-edit { background: #ef6c00; padding: 8px 15px; font-size: 14px; }
    .btn-cancel { background: #666; margin-left: 10px; }
    .rank-1 td { background: #fffde7 !important; }
    .rank-2 td, .rank-3 td { background: #fafafa !important; }
    .badge {
      display: inline-block;
      color: #fff;
      font-size: .75em;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .badge-1 { background: #fbc02d; }
    .badge-2 { background: #9e9e9e; }
    .badge-3 { background: #8d6e63; }
    .stats-cell { white-space: nowrap; }
    .error-msg {
      color: #c62828;
      background: #ffebee;
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
      word-break: break-word;
    }
    @media (max-width: 640px) {
      body { padding: 10px; }
      .container { padding: 18px; }
      h1 { font-size: 1.55rem; }
      h2 { font-size: 1.25rem; }
      .attendance-row { flex-direction: column; align-items: flex-start; }
      .attendance-options { display: flex; gap: 10px; flex-wrap: wrap; }
      .attendance-options label { margin-right: 0; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="view-loading" class="loading">読み込み中...</div>

  <div id="view-no-link" class="hidden notice">
    <h1>イベント日程調整</h1>
    <p>このページは、主催者から共有されたイベントリンクからご利用ください。</p>
  </div>

  <div id="view-event" class="hidden">
    <h1 id="display-event-name"></h1>

    <div id="edit-container" class="edit-box hidden">
      <label style="color:#e65100;">自分の回答を修正する</label>
      <div class="edit-row">
        <select id="edit-user-select">
          <option value="">-- 名前を選択 --</option>
        </select>
        <button id="btn-start-edit" class="btn-edit">修正する</button>
      </div>
    </div>

    <h2>出欠表</h2>
    <div class="table-wrapper">
      <table id="attendance-table"></table>
    </div>

    <h2 id="form-title">出欠を入力する</h2>
    <div class="form-group">
      <label for="user-name">お名前</label>
      <input type="text" id="user-name" placeholder="例：山田 太郎">
      <small style="color:#666;">※全く同じ名前を入力すると上書きされます。フルネームでの入力をお勧めします。</small>
    </div>

    <div class="form-group" id="attendance-form-list"></div>

    <div class="form-group">
      <label for="user-comment">コメント（任意）</label>
      <input type="text" id="user-comment" placeholder="例：遅れて参加します">
    </div>

    <button id="btn-submit-response">回答を送信</button>
    <button id="btn-cancel-edit" class="btn-cancel hidden">修正をキャンセル</button>
    <div id="error-container" class="error-msg hidden"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZNUBnvO0t4ExD99dHUQYkJUx1rIKO3hk",
    authDomain: "scheduleadjustment-41555.firebaseapp.com",
    projectId: "scheduleadjustment-41555",
    storageBucket: "scheduleadjustment-41555.firebasestorage.app",
    messagingSenderId: "989847585888",
    appId: "1:989847585888:web:6c1d3cc5923facc4dcef05"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let currentEventData = null;
  let currentEventId = null;

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showOnly(id) {
    ['view-loading', 'view-no-link', 'view-event'].forEach(viewId => {
      document.getElementById(viewId).classList.toggle('hidden', viewId !== id);
    });
  }

  function showError(message, error) {
    const box = document.getElementById('error-container');
    box.textContent = `${message}${error ? ` (${error.message || error})` : ''}`;
    box.classList.remove('hidden');
    console.error(error);
  }

  function renderAttendanceForm() {
    const container = document.getElementById('attendance-form-list');
    container.innerHTML = '';
    if (!currentEventData?.dates?.length) return;

    currentEventData.dates.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'attendance-row';
      row.innerHTML = `
        <div><strong>${escapeHtml(d.date)}</strong> <small>${escapeHtml(d.time)}</small></div>
        <div class="attendance-options">
          <label><input type="radio" name="attend-${i}" value="●"> ● OK</label>
          <label><input type="radio" name="attend-${i}" value="△" checked> △ 未定</label>
          <label><input type="radio" name="attend-${i}" value="×"> × 不可</label>
        </div>`;
      container.appendChild(row);
    });
  }

  function renderAttendanceTable() {
    const table = document.getElementById('attendance-table');
    const event = currentEventData;
    const responsesList = event.responses ? Object.values(event.responses) : [];
    const hasResponses = responsesList.length > 0;

    const stats = event.dates.map((d, index) => {
      let countO = 0, countT = 0, countX = 0;
      const key = `${d.date}-${d.time}`;
      responsesList.forEach(res => {
        const mark = res.attendances?.[key];
        if (mark === '●') countO++;
        else if (mark === '△') countT++;
        else if (mark === '×') countX++;
      });
      return { countO, countT, countX, index };
    });

    const sorted = [...stats].filter(s => s.countO > 0).sort((a,b) => b.countO - a.countO);
    const rankMap = {};
    let currentScore = -1, currentRank = 1, actualRank = 1;
    sorted.forEach(s => {
      if (s.countO !== currentScore) {
        currentScore = s.countO;
        currentRank = actualRank;
      }
      if (currentRank <= 3) rankMap[s.index] = currentRank;
      actualRank++;
    });

    let html = '<tr><th>日程</th><th>集計</th>';
    if (hasResponses) {
      responsesList.forEach(res => {
        const comment = res.comment
          ? `<div style="font-size:.8em;color:#555;font-weight:normal;margin-top:6px;white-space:normal;min-width:90px;text-align:left;padding:5px;background:#fff;border-radius:4px;border:1px solid #ccc;">${escapeHtml(res.comment)}</div>`
          : '';
        html += `<th class="user-col" style="vertical-align:top;">${escapeHtml(res.name)}${comment}</th>`;
      });
    } else {
      html += '<th>回答者</th>';
    }
    html += '</tr>';

    event.dates.forEach((d, index) => {
      const st = stats[index];
      const rank = rankMap[index];
      const key = `${d.date}-${d.time}`;
      let rowClass = '', badge = '';
      if (rank === 1) { rowClass = 'rank-1'; badge = '<span class="badge badge-1">👑 1位</span><br>'; }
      else if (rank === 2) { rowClass = 'rank-2'; badge = '<span class="badge badge-2">🥈 2位</span><br>'; }
      else if (rank === 3) { rowClass = 'rank-3'; badge = '<span class="badge badge-3">🥉 3位</span><br>'; }

      html += `<tr class="${rowClass}">`;
      html += `<td>${badge}${escapeHtml(d.date)}<br><small>${escapeHtml(d.time)}</small></td>`;
      html += `<td class="stats-cell"><span class="mark-circle">●</span>${st.countO} <span class="mark-triangle">△</span>${st.countT} <span class="mark-cross">×</span>${st.countX}</td>`;

      if (hasResponses) {
        responsesList.forEach(res => {
          const mark = res.attendances?.[key] || '-';
          const css = mark === '●' ? 'mark-circle' : mark === '△' ? 'mark-triangle' : mark === '×' ? 'mark-cross' : '';
          html += `<td class="${css}">${escapeHtml(mark)}</td>`;
        });
      } else {
        html += '<td style="color:#999;font-size:.9em;">まだ回答がありません</td>';
      }
      html += '</tr>';
    });

    table.innerHTML = html;
  }

  function rebuildEditSelect() {
    const select = document.getElementById('edit-user-select');
    const previous = select.value;
    select.innerHTML = '<option value="">-- 名前を選択 --</option>';
    const responses = currentEventData?.responses ? Object.values(currentEventData.responses) : [];
    document.getElementById('edit-container').classList.toggle('hidden', responses.length === 0);
    responses.forEach(res => {
      const option = document.createElement('option');
      option.value = res.name;
      option.textContent = res.name;
      select.appendChild(option);
    });
    if (previous && currentEventData.responses?.[previous]) select.value = previous;
  }

  function resetForm() {
    const name = document.getElementById('user-name');
    name.value = '';
    name.disabled = false;
    name.style.backgroundColor = '';
    document.getElementById('user-comment').value = '';
    document.getElementById('form-title').textContent = '出欠を入力する';
    document.getElementById('btn-submit-response').textContent = '回答を送信';
    document.getElementById('btn-cancel-edit').classList.add('hidden');
    currentEventData?.dates?.forEach((d, i) => {
      const radio = document.querySelector(`input[name="attend-${i}"][value="△"]`);
      if (radio) radio.checked = true;
    });
  }

  function setupActions() {
    document.getElementById('btn-start-edit').onclick = () => {
      const selectedName = document.getElementById('edit-user-select').value;
      if (!selectedName) return alert('修正したいお名前を選択してください。');
      const res = currentEventData.responses?.[selectedName];
      if (!res) return;

      const name = document.getElementById('user-name');
      name.value = res.name;
      name.disabled = true;
      name.style.backgroundColor = '#e0e0e0';
      document.getElementById('user-comment').value = res.comment || '';
      currentEventData.dates.forEach((d, i) => {
        const key = `${d.date}-${d.time}`;
        const mark = res.attendances?.[key] || '△';
        const radio = document.querySelector(`input[name="attend-${i}"][value="${mark}"]`);
        if (radio) radio.checked = true;
      });
      document.getElementById('form-title').textContent = `出欠を修正する（${selectedName}さん）`;
      document.getElementById('btn-submit-response').textContent = '修正を保存する';
      document.getElementById('btn-cancel-edit').classList.remove('hidden');
      document.getElementById('form-title').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btn-cancel-edit').onclick = resetForm;

    document.getElementById('btn-submit-response').onclick = async () => {
      const name = document.getElementById('user-name').value.trim();
      if (!name) return alert('お名前を入力してください。');

      const attendances = {};
      currentEventData.dates.forEach((d, i) => {
        const selected = document.querySelector(`input[name="attend-${i}"]:checked`);
        attendances[`${d.date}-${d.time}`] = selected ? selected.value : '△';
      });

      const btn = document.getElementById('btn-submit-response');
      btn.disabled = true;
      try {
        await setDoc(doc(db, 'events', currentEventId), {
          responses: {
            [name]: {
              name,
              comment: document.getElementById('user-comment').value.trim(),
              attendances
            }
          }
        }, { merge: true });
        alert('回答を保存しました！');
        resetForm();
      } catch (error) {
        showError('回答の送信に失敗しました。', error);
      } finally {
        btn.disabled = false;
      }
    };
  }

  const params = new URLSearchParams(location.search);
  currentEventId = params.get('id');

  if (!currentEventId) {
    showOnly('view-no-link');
  } else {
    setupActions();
    onSnapshot(doc(db, 'events', currentEventId), snapshot => {
      if (!snapshot.exists()) {
        showOnly('view-no-link');
        document.querySelector('#view-no-link p').textContent = 'イベントが見つかりません。共有リンクをご確認ください。';
        return;
      }
      currentEventData = snapshot.data();
      showOnly('view-event');
      document.getElementById('display-event-name').textContent = currentEventData.name || 'イベント';
      renderAttendanceForm();
      rebuildEditSelect();
      renderAttendanceTable();
    }, error => {
      showOnly('view-event');
      showError('データの読み込みに失敗しました。', error);
    });
  }
</script>
</body>
</html>
